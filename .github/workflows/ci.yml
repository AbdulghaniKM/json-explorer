name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # A pre-rename token just stops emitting its utility, so the element renders unstyled
      # and every other check still passes. Nothing else catches it.
      - run: pnpm check:tokens

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The CSP pins the inline theme script by hash; fail if vercel.json drifted.
      - run: node scripts/csp-hash.js
